name: Lint / Nix

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lint-nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "**/*.nix"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lint-nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "**/*.nix"

concurrency:
  group: lint-nix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-nix:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22

      - name: Check flake
        shell: bash
        run: |
          nix flake check \
            --all-systems \
            --show-trace \
            --print-build-logs

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t nix_files < <(git ls-files '*.nix')
          nix run nixpkgs#nixfmt -- --check "${nix_files[@]}"

      - name: Statix
        shell: bash
        run: nix run nixpkgs#statix -- check .

      - name: Deadnix
        shell: bash
        run: nix run nixpkgs#deadnix -- --fail .
