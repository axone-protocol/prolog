name: Lint Go

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lint-go.yml"
      - ".golangci.yml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lint-go.yml"
      - ".golangci.yml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"

concurrency:
  group: lint-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-go:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0

      - name: Check Go formatting
        run: |
          if nix develop --command gofumpt -l . | grep -qE '\.go$'; then
            echo "Go files must be formatted with gofumpt."
            nix develop --command gofumpt -d .
            exit 1
          fi

      - name: Verify Go modules are tidy
        run: nix develop --command go mod tidy -diff

      - name: Lint Go code
        run: nix develop --command golangci-lint run ./...
